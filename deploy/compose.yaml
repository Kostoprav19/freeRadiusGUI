name: freeradiusgui-prod

services:
  # MySQL service.
  db:
    image: ${MYSQL_IMAGE_NAME}
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db-data:/var/lib/mysql
      - ./databaseCreationScript.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # FreeRADIUS service.
  freeradius:
    build:
      context: ../docker/freeradius
      dockerfile: Dockerfile
    image: ${RADIUS_IMAGE_NAME}:${RADIUS_IMAGE_TAG}
    container_name: freeradius
    restart: unless-stopped
    command: ["-X"]
    ports:
      - "${RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${RADIUS_ACCT_PORT:-1813}:1813/udp"
    volumes:
      # Operator-supplied clients.conf + users (see deploy/radius-config/).
      - ./radius-config:/data/radius-config
      - radius-logs:/var/log/freeradius/radacct
    # "Port up and listening": the auth socket (1812/udp) is bound. 0714 is 1812
    # in hex as it appears in /proc/net/udp{,6}; checked this way because the
    # image ships no ss/netstat/nc.
    healthcheck:
      test:
        - CMD-SHELL
        - grep -qE ':0714 ' /proc/net/udp /proc/net/udp6 2>/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Role: FreeRADIUSGUI web app.
  app:
    image: ${APP_IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      freeradius:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -Duser.timezone=UTC -DLOGBACK_LOG_PATH=/var/log/freeradiusgui"
      # Startup mount checks always run; these paths must be set explicitly
      # (the entrypoint assumes no defaults) and must match the mounts below.
      FREERADIUSGUI_CLIENTS_FILE: /etc/freeradius/clients.conf
      FREERADIUSGUI_USERS_FILE: /etc/freeradius/users
      FREERADIUSGUI_RADACCT_DIR: /var/log/freeradius/radacct
      FREERADIUSGUI_LOGBACK_DIR: /var/log/freeradiusgui
    volumes:
      - ./config.properties:/usr/local/tomcat/webapps/ROOT/WEB-INF/classes/config.properties:ro
      - ./radius-config:/etc/freeradius
      - radius-logs:/var/log/freeradius/radacct:ro
      - app-logs:/var/log/freeradiusgui
      # Lets the app restart/inspect the freeradius container via the Docker
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # HAProxy — TLS termination.
  haproxy:
    image: haproxy:3.0-alpine
    container_name: haproxy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HAPROXY_PORT:-443}:443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db-data:
  radius-logs:
  app-logs:
