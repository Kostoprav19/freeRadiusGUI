# Example clients.conf for production.
#
# Copy your real file into deploy/radius-config/clients.conf (git-ignored)
# before starting the stack - the freeradius container refuses to boot without
# it. Typically you supply the file straight from the RADIUS server, e.g.
#   cp /path/to/configs_from_server/clients.conf deploy/radius-config/clients.conf
#
# Never commit real shared secrets.

client localhost {
    ipaddr = 127.0.0.1
    secret = changeme
    shortname = localhost
    require_message_authenticator = no
}
