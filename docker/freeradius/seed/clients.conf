# Default clients.conf seeded into the radius-config volume on first boot.
# Replace the placeholder secret(s) and add your real NAS devices via the
# web UI (or by editing this file before first start). Never commit real
# shared secrets.

client localhost {
    ipaddr = 127.0.0.1
    secret = changeme
    shortname = localhost
    require_message_authenticator = no
}
