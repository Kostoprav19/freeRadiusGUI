name: freeradiusgui

services:
  # MySQL service.
  db:
    image: mysql:8.0
    container_name: freeradiusgui-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-freeradiusgui}
      MYSQL_USER: ${MYSQL_USER:-freeradius}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-koJasmoJas2}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db-data:/var/lib/mysql
      - ../databaseCreationScript.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./dev-seed.sql:/docker-entrypoint-initdb.d/20-dev-seed.sql:ro
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD:-rootpw}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Role: FreeRADIUSGUI web app.
  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    image: ${APP_IMAGE_NAME:-freeradiusgui}:${APP_IMAGE_TAG:-latest}
    container_name: freeradiusgui-app
    depends_on:
      db:
        condition: service_healthy
      freeradius:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -Duser.timezone=UTC -DLOGBACK_LOG_PATH=/var/log/freeradiusgui"
      FREERADIUSGUI_CLIENTS_FILE: ${FREERADIUSGUI_CLIENTS_FILE:-/etc/freeradius/clients.conf}
      FREERADIUSGUI_USERS_FILE: ${FREERADIUSGUI_USERS_FILE:-/etc/freeradius/users}
      FREERADIUSGUI_RADACCT_DIR: ${FREERADIUSGUI_RADACCT_DIR:-/var/log/freeradius/radacct}
    volumes:
      - ./config.properties:/usr/local/tomcat/webapps/ROOT/WEB-INF/classes/config.properties:ro
      # Shared writable config volume (same model as prod): the app rewrites
      # clients.conf/users here on "Apply changes" and freeradius reads them
      # back via /data/radius-config after a restart.
      - radius-config:/etc/freeradius
      - radius-logs:/var/log/freeradius/radacct
      - app-logs:/var/log/freeradiusgui
      # Lets the app restart/inspect the freeradius container via the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock

  # FreeRADIUS service (dev only). Uses the same image as prod (../docker/freeradius)
  # so reply_log, the auth-detail config, and the radacct chown all match.
  freeradius:
    profiles: ["app"]
    build:
      context: ../docker/freeradius
      dockerfile: Dockerfile
    image: ${RADIUS_IMAGE_NAME:-freeradiusgui-radius}:${RADIUS_IMAGE_TAG:-latest}
    container_name: freeradiusgui-radius
    restart: unless-stopped
    command: ["-X"]
    ports:
      - "${RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${RADIUS_ACCT_PORT:-1813}:1813/udp"
    volumes:
      # Shared writable config volume (same one the app mounts at
      # /etc/freeradius). Seeded on first boot from the lab repo files below,
      # which carry the dockernet client + dev MAC entries the radclient loop
      # relies on. After the app's "Apply changes" rewrites the volume, a
      # restart makes freeradius pick up the new config.
      - radius-config:/data/radius-config
      - ./freeradius/raddb/clients.conf:/usr/local/share/freeradius-seed/clients.conf:ro
      - ./freeradius/raddb/mods-config/files/authorize:/usr/local/share/freeradius-seed/users:ro
      - radius-logs:/var/log/freeradius/radacct
    # Healthy once the config volume is seeded, so the app waits for the files
    # to exist before it starts (mirrors prod).
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /data/radius-config/clients.conf && test -f /data/radius-config/users
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Radclient service (dev only).
  radclient:
    profiles: ["app"]
    image: freeradius/freeradius-server:latest-3.2
    container_name: freeradiusgui-radclient
    restart: unless-stopped
    depends_on:
      - freeradius
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        while :; do
          radclient -c 1 -r 1 freeradius:1812 auth testing123 < /requests.txt || true
          sleep ${RADCLIENT_INTERVAL:-5}
        done
    volumes:
      - ./freeradius/requests.txt:/requests.txt:ro

volumes:
  db-data:
  radius-config:
  radius-logs:
  app-logs:
