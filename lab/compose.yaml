name: freeradiusgui

services:
  # MySQL service.
  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db-data:/var/lib/mysql
      - ../databaseCreationScript.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./dev-seed.sql:/docker-entrypoint-initdb.d/20-dev-seed.sql:ro
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Role: FreeRADIUSGUI web app.
  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    image: ${APP_IMAGE_NAME:-freeradiusgui}:${APP_IMAGE_TAG:-latest}
    container_name: freeradiusgui
    depends_on:
      db:
        condition: service_healthy
      freeradius:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -Duser.timezone=UTC -DLOGBACK_LOG_PATH=/var/log/freeradiusgui"
      # Startup mount checks always run; these paths must be set explicitly
      # (the entrypoint assumes no defaults) and must match the mounts below.
      FREERADIUSGUI_CLIENTS_FILE: /etc/freeradius/clients.conf
      FREERADIUSGUI_USERS_FILE: /etc/freeradius/users
      FREERADIUSGUI_RADACCT_DIR: /var/log/freeradius/radacct
      FREERADIUSGUI_LOGBACK_DIR: /var/log/freeradiusgui
    volumes:
      - ./config.properties:/usr/local/tomcat/webapps/ROOT/WEB-INF/classes/config.properties:ro
      # Shared host config dir (same model as prod): the app rewrites
      # clients.conf/users here on "Apply changes" and freeradius reads them
      # back via /data/radius-config after a restart. Populated from
      # lab/radius-config.example/ (see tests/smoke-test.sh / README).
      - ./radius-config:/etc/freeradius
      - radius-logs:/var/log/freeradius/radacct
      - app-logs:/var/log/freeradiusgui
      # Lets the app restart/inspect the freeradius container via the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock

  # FreeRADIUS service (dev only). Uses the same image as prod (../docker/freeradius)
  # so reply_log, the auth-detail config, and the radacct chown all match.
  freeradius:
    profiles: ["app"]
    build:
      context: ../docker/freeradius
      dockerfile: Dockerfile
    image: ${RADIUS_IMAGE_NAME}:${RADIUS_IMAGE_TAG}
    container_name: freeradius
    restart: unless-stopped
    command: ["-X"]
    ports:
      - "${RADIUS_AUTH_PORT}:1812/udp"
      - "${RADIUS_ACCT_PORT}:1813/udp"
    volumes:
      # Shared host config dir (same one the app mounts at /etc/freeradius).
      # Holds clients.conf + users with the dockernet client + dev MAC entries
      # the radclient loop relies on; populated from lab/radius-config.example/.
      # The container refuses to start if the files are missing (mirrors prod).
      - ./radius-config:/data/radius-config
      - radius-logs:/var/log/freeradius/radacct
    # "Port up and listening": healthy once the auth socket (1812/udp) is bound,
    # so the app waits for the daemon to be ready (mirrors prod). 0714 is 1812 in
    # hex as it appears in /proc/net/udp{,6}; checked this way because the image
    # ships no ss/netstat/nc.
    healthcheck:
      test:
        - CMD-SHELL
        - grep -qE ':0714 ' /proc/net/udp /proc/net/udp6 2>/dev/null
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Radclient service (dev only).
  radclient:
    profiles: ["app"]
    image: freeradius/freeradius-server:latest-3.2
    container_name: radclient
    restart: unless-stopped
    depends_on:
      - freeradius
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        while :; do
          radclient -c 1 -r 1 freeradius:1812 auth testing123 < /requests.txt || true
          sleep ${RADCLIENT_INTERVAL:-5}
        done
    volumes:
      - ./radclient/requests.txt:/requests.txt:ro

volumes:
  db-data:
  radius-logs:
  app-logs:
