[tools]
java  = "temurin-25"
maven = "3.9.9"

[env]
# Keep Maven output quiet(ish) and avoid interactive prompts in CI.
MAVEN_OPTS = "-Xmx1g"
# Image identity used by docker:* tasks. Override the *_REPO vars with
# registry-qualified names (e.g. ghcr.io/<owner>/...) for docker:push to be
# more than a no-op; see prod-05 plan.
IMAGE_REPO        = "danielsatkacuns/freeradiusgui"
RADIUS_IMAGE_REPO = "danielsatkacuns/freeradiusgui-radius"
IMAGE_TAG         = "latest"
IMAGE             = "{{env.IMAGE_REPO}}:{{env.IMAGE_TAG}}"
RADIUS_IMAGE      = "{{env.RADIUS_IMAGE_REPO}}:{{env.IMAGE_TAG}}"

# ---------- Maven / Java -----------------------------------------------------

[tasks.build]
description = "Compile and package the WAR (skips tests)"
run = "mvn -B -ntp -DskipTests clean package"

[tasks.test]
description = "Run unit tests (JUnit Jupiter, Surefire 3.2.x)"
run = "mvn -B -ntp test"

[tasks.verify]
description = "Full verify: compile, test, package"
run = "mvn -B -ntp clean verify"

[tasks.package]
description = "Produce target/freeradiusgui.war"
run = "mvn -B -ntp clean package"

[tasks.clean]
description = "Remove build artifacts"
run = "mvn -B -ntp clean"

[tasks.lint]
description = "Lint all Java files (Spotless + google-java-format AOSP)"
run = "mvn -B -ntp spotless:check"

[tasks.format]
description = "Auto-fix formatting & imports on all Java files in place"
run = "mvn -B -ntp spotless:apply"

# ---------- Docker -----------------------------------------------------------

[tasks."docker:build"]
description = "Build + tag the app and freeradius images ($IMAGE, $RADIUS_IMAGE)"
run = '''
set -e
version=$(mvn -B -ntp -q -DforceStdout=true help:evaluate -Dexpression=project.version 2>/dev/null)
if [ -z "$version" ]; then
  echo "error: could not resolve project.version from pom.xml" >&2
  exit 1
fi

# App image (multi-stage build from repo root).
docker build -t "$IMAGE" -f docker/app/Dockerfile .
docker tag "$IMAGE" "${IMAGE_REPO}:${version}"
docker tag "$IMAGE" "${IMAGE_REPO}:latest"
echo "tagged: ${IMAGE_REPO}:${version}"
echo "tagged: ${IMAGE_REPO}:latest"

# FreeRADIUS image (context is its own dir).
docker build -t "$RADIUS_IMAGE" docker/freeradius
docker tag "$RADIUS_IMAGE" "${RADIUS_IMAGE_REPO}:${version}"
docker tag "$RADIUS_IMAGE" "${RADIUS_IMAGE_REPO}:latest"
echo "tagged: ${RADIUS_IMAGE_REPO}:${version}"
echo "tagged: ${RADIUS_IMAGE_REPO}:latest"
'''

[tasks."docker:push"]
description = "Push app + freeradius images (:<version> and :latest) to the registry (no-op if *_REPO are unqualified)"
run = '''
set -e
version=$(mvn -B -ntp -q -DforceStdout=true help:evaluate -Dexpression=project.version 2>/dev/null)
if [ -z "$version" ]; then
  echo "error: could not resolve project.version from pom.xml" >&2
  exit 1
fi
docker push "${IMAGE_REPO}:${version}"
docker push "${IMAGE_REPO}:latest"
docker push "${RADIUS_IMAGE_REPO}:${version}"
docker push "${RADIUS_IMAGE_REPO}:latest"
'''

# ---------- Docker Compose (MySQL + optional app) ---------------------------

[tasks."db:up"]
description = "Start the MySQL container in the background"
dir = "lab"
run = "docker compose up -d db"

[tasks."db:down"]
description = "Stop the compose stack (keep DB volume)"
dir = "lab"
run = "docker compose down"

[tasks."db:reset"]
description = "Stop stack and delete the DB volume (re-seeds on next up)"
dir = "lab"
run = "docker compose down -v"

[tasks."compose:up"]
description = "Run full stack (app + DB + FreeRADIUS + radclient) via compose"
dir = "lab"
run = '''
# freeradius refuses to start without clients.conf + users; seed the bind-mount
# dir from the tracked example on first run (never clobbers existing edits).
mkdir -p radius-config
[ -s radius-config/clients.conf ] || cp radius-config.example/clients.conf radius-config/clients.conf
[ -s radius-config/users ] || cp radius-config.example/users radius-config/users
docker compose --profile app up --build
'''

[tasks."compose:down"]
description = "Stop the full compose stack"
dir = "lab"
run = "docker compose --profile app down"

# ---------- Smoke test ------------------------------------------------------

[tasks.smoke]
description = "Full-lifecycle smoke test: db:reset + compose:up + login + page walk + report"
run = "bash tests/smoke-test.sh"
