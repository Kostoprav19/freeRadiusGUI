#----- PATH TO FREERADIUS CONFIG AND LOG FILES ---
#Path to freeradius users file
usersfilepath = ${FREERADIUSGUI_USERS_FILE:/etc/freeradius/users}
#Path to freeradius clients.conf file
clientsfilepath = ${FREERADIUSGUI_CLIENTS_FILE:/etc/freeradius/clients.conf}
#Path to freeradius log files
logfilesdirpath = ${FREERADIUSGUI_RADACCT_DIR:/var/log/freeradius/radacct}

#----- DATABASE -----
dbDriverClass = ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
dbUrl = ${DB_URL:jdbc:mysql://localhost:3306/freeradiusgui?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
dbUser = ${DB_USER:freeradius}
dbPassword = ${DB_PASSWORD:koJasmoJas2}
dbMinPoolSize = ${DB_MIN_POOL:5}
dbMaxPoolSize = ${DB_MAX_POOL:20}
dbCheckoutTimeout = ${DB_CHECKOUT_TIMEOUT_MS:1800}

#----- MAIL -----
# Rejected-RADIUS-request notifications are opt-in. Set mailEnabled = true
# to send them; defaults to false (skips SMTP setup at startup and
# short-circuits sendMail() to a no-op).
mailEnabled = ${MAIL_ENABLED:false}
mailFrom = ${MAIL_FROM:freeradius1@local}
mailTo = ${MAIL_TO:help@local}
mailSmtpServer = ${MAIL_SMTP_SERVER:10.0.0.100}

#----- SHELL COMMANDS -----
shellPgrepFreeradius = ${SHELL_PGREP_FREERADIUS:pgrep -fl freeradius}
shellPgrepTomcat = ${SHELL_PGREP_TOMCAT:pgrep -fl tomcat}
shellPgrepMysql = ${SHELL_PGREP_MYSQL:pgrep -fl mysqld}
shellStopFreeradius = ${SHELL_STOP_FREERADIUS:killall freeradius}
shellStartFreeradius = ${SHELL_START_FREERADIUS:freeradius}
